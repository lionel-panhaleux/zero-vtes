name: ci

# CLAUDE.md's checks: the default members (engine, policy, api, host,
# protocol) and the shells that build without Python (server, wasm).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --profile ci -- -D warnings
      - run: cargo clippy -p zvtes-server -p zvtes-wasm --all-targets --profile ci -- -D warnings
      - run: cargo test --profile ci
      - run: cargo test -p zvtes-api --features schema --profile ci
      - run: python3 scripts/gen_ts.py --check crates/api/protocol.ts
      - run: python3 scripts/rulings_v5.py --check data/rulings-v5.csv
