[package]
name = "zvtes-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

# A game behind the contract (docs/protocol.md, docs/online-plan.md):
# commands in, messages out, per seat; bots answered inside; the record.
# Servers and the wasm module are thin shells over `Game::handle`.
[lib]
name = "zvtes_host"

[dependencies]
zero-vtes-engine = { path = "../engine" }
zvtes-api = { path = "../api" }
serde = "1"
serde_json = "1"
# The English renderings (the `text` setting), over the contract alone.
zvtes-text = { path = "../text" }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
