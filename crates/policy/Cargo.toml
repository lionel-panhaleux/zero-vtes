[package]
name = "zvtes-policy"
version = "0.0.1"
edition = "2021"
license = "MIT"

# The trained policy's inference, by hand (docs/online-plan.md "The bots"): no
# third-party dependency, so the bot runs wherever the engine does (a
# server); the profiles a host offers beside it.
# Mirrors `train/model.py`'s `Policy.forward` — keep them in step
# (`train/tests/test_export.py` compares the two).
[lib]
name = "zvtes_policy"

[dependencies]
zero-vtes-engine = { path = "../engine" }
zvtes-env = { path = "../env" }
# The profiles a host offers (`profiles`: `zvtes_host::Bots`, its records).
zvtes-api = { path = "../api" }
zvtes-host = { path = "../host" }

[dev-dependencies]
zero-vtes-engine = { path = "../engine", features = ["fixtures"] }
serde_json = "1"
