[package]
name = "zvtes-policy"
version = "0.0.1"
edition = "2021"
license = "MIT"

# The trained policy's inference, by hand (docs/human-play.md slice 3): no
# dependency, so the bot runs wherever the engine does (a server).
# Mirrors `train/model.py`'s `Policy.forward` — keep them in step
# (`train/tests/test_export.py` compares the two).
[lib]
name = "zvtes_policy"

[dependencies]
zero-vtes-engine = { path = "../engine" }

[dev-dependencies]
zero-vtes-engine = { path = "../engine", features = ["fixtures"] }
# Examples reading the owner's games (`examples/waste.rs`).
zvtes-api = { path = "../api" }
zvtes-host = { path = "../host" }
serde_json = "1"
