[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "zvtes-py"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = ["numpy"]

[tool.maturin]
module-name = "zvtes_py"

# Rebuilt by `uv sync` when the Rust sources change.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
  { file = "../engine/src/**/*.rs" },
  { file = "../engine/Cargo.toml" },
  { file = "../policy/src/**/*.rs" },
  { file = "../api/src/**/*.rs" },
  { file = "../host/src/**/*.rs" },
  { file = "../text/src/**/*.rs" },
]
