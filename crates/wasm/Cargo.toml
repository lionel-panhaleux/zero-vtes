[package]
name = "zvtes-wasm"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The zero-vtes VTES engine and bots in the browser: JSON messages in and out (docs/protocol.md)"

# Built by wasm-pack only (`wasm-pack build crates/wasm`), outside the
# workspace's default members like the Python module.
[lib]
name = "zvtes_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
zero-vtes-engine = { path = "../engine" }
zvtes-api = { path = "../api" }
zvtes-host = { path = "../host" }
zvtes-policy = { path = "../policy" }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
